name: Stage 9 validation
# validates the current stage9 branch head

on:
  push:
    branches: [main, stage9-pwa-backup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production assets
        run: npm run validate:assets
      - name: Validate content
        run: npm run validate:content
      - name: Syntax checks
        run: |
          npm run check
          npm run check:stage8
          npm run check:stage9
      - name: Unit tests
        run: npm test
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Stage 9 PWA and restore tests
        run: npm run test:stage9
      - name: Stage 1-8 browser regression
        run: node tests/stage1-browser-check.mjs
